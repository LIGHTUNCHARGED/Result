<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSUT Result Portal 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        header { text-align: center; margin-bottom: 20px; }

        .controls-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background: var(--card);
            padding: 15px 0;
            z-index: 100;
        }

        .search-input {
            flex: 2;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
        }

        .branch-select {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .search-input:focus, .branch-select:focus { border-color: var(--primary); }

        .stats { font-size: 0.9rem; color: #64748b; font-weight: 600; margin-bottom: 10px; }

        .table-wrapper { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 10px; }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }

        th {
            background-color: #f1f5f9;
            padding: 12px 15px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #475569;
            text-align: left;
            cursor: pointer;
            user-select: none;
        }

        th:hover { background-color: #e2e8f0; }
        th::after { content: ' ↕'; opacity: 0.3; }

        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }

        .rank-pill {
            background: #dcfce7;
            color: #166534;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .branch-tag {
            font-size: 0.7rem;
            color: #64748b;
            display: block;
            line-height: 1.2;
        }

        #loadingOverlay { text-align: center; padding: 50px; color: var(--primary); font-weight: bold; }
        #noResults { display: none; text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>NSUT Result Portal 2025</h1>
        <p>Full Batch Statistics & Search</p>
    </header>

    <div class="controls-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Name or Roll No...">
        <select id="branchFilter" class="branch-select">
            <option value="">All Branches</option>
        </select>
    </div>

    <div id="stats" class="stats">Loading Student Database...</div>
    <div id="loadingOverlay">Processing 2,066 Records...</div>

    <div class="table-wrapper" id="tableWrapper" style="display:none;">
        <table id="studentTable">
            <thead>
            <tr>
                <th onclick="sortTable('SNo')">SNo</th>
                <th onclick="sortTable('Global Rank')">Rank</th>
                <th onclick="sortTable('Name')">Name</th>
                <th onclick="sortTable('Roll No')">Roll No</th>
                <th onclick="sortTable('SGPA')">SGPA</th>
                <th onclick="sortTable('Branch')">Branch</th>
            </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
    <div id="noResults">No students found matching your filters.</div>
</div>

<script>
    let studentData = [];
    let currentSort = { column: 'SNo', asc: true };

    async function loadData() {
        try {
            const response = await fetch('NSUT_Batch_2025_Results.json');
            studentData = await response.json();

            populateBranchFilter();
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('tableWrapper').style.display = 'block';

            applyFilters();
        } catch (e) {
            document.getElementById('stats').innerText = "Error: JSON file not found.";
        }
    }

    function populateBranchFilter() {
        const select = document.getElementById('branchFilter');
        const branches = [...new Set(studentData.map(s => s.Branch))].sort();
        branches.forEach(branch => {
            const opt = document.createElement('option');
            opt.value = branch;
            opt.textContent = branch;
            select.appendChild(opt);
        });
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        const branchTerm = document.getElementById('branchFilter').value;

        let filtered = studentData.filter(s => {
            const matchesSearch = s.Name.toLowerCase().includes(searchTerm) ||
                s['Roll No'].toLowerCase().includes(searchTerm);
            const matchesBranch = branchTerm === "" || s.Branch === branchTerm;
            return matchesSearch && matchesBranch;
        });

        renderTable(filtered);
        document.getElementById('stats').innerText = `Showing ${filtered.length} of ${studentData.length} students`;
    }

    function sortTable(column) {
        currentSort.asc = (currentSort.column === column) ? !currentSort.asc : true;
        currentSort.column = column;

        studentData.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            if (typeof valA === 'string') {
                return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
                return currentSort.asc ? valA - valB : valB - valA;
            }
        });

        applyFilters();
    }

    function renderTable(data) {
        const tbody = document.getElementById('resultsBody');
        const noResults = document.getElementById('noResults');
        tbody.innerHTML = '';

        if (data.length === 0) {
            noResults.style.display = 'block';
            return;
        }

        noResults.style.display = 'none';
        const fragment = document.createDocumentFragment();

        data.forEach(student => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:#94a3b8">${student.SNo}</td>
                <td><span class="rank-pill">#${student['Global Rank']}</span></td>
                <td><strong>${student.Name}</strong></td>
                <td><code>${student['Roll No']}</code></td>
                <td style="font-weight:700; color:#2563eb">${student.SGPA}</td>
                <td><span class="branch-tag">${student.Branch}</span></td>
            `;
            fragment.appendChild(tr);
        });
        tbody.appendChild(fragment);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('branchFilter').addEventListener('change', applyFilters);

    loadData();
</script>

</body>
</html>
